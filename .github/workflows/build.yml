name: build and deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and push container
        run: |
          set -euxo pipefail
          docker build -f UvA.SecureEduIdInviteProxy/Dockerfile -t "datanosecr.azurecr.io/eduid-invite-proxy:latest" .
          docker push "datanosecr.azurecr.io/eduid-invite-proxy:latest"

